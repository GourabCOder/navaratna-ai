<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navaratna | Sign In</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<style>

.auth-container {
    height: 100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    z-index:10;
}

.auth-box {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(15px);
    border:1px solid var(--border-color);
    border-radius:16px;
    padding:40px;
    width:100%;
    max-width:400px;
    text-align:center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.auth-title{
    font-family:'Inter',sans-serif;
    font-weight: 700;
    font-size:2rem;
    color:var(--text-primary);
    margin-bottom:30px;
}

.input-group{
    margin-bottom:20px;
    text-align:left;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    color:var(--text-dim);
}

.input-group input{
    width:100%;
    background:#ffffff;
    border:1px solid var(--border-color);
    border-radius:8px;
    padding:12px 15px;
    color:var(--text-primary);
}
.input-group input:focus {
    border-color: var(--text-gold);
    outline: none;
}

.auth-submit-btn{
    width:100%;
    margin-top:10px;
}

.flash-msg{
    color:var(--accent-red);
    margin-bottom:15px;
}

.flash-success{
    color:#16a34a;
}

.auth-link {
    margin-top: 25px;
    display: block;
    color: var(--text-dim);
    font-size: 0.9rem;
    text-decoration: none;
    transition: color 0.3s;
}
.auth-link:hover {
    color: var(--text-gold);
}

body{
    background-color: var(--bg-color);
}

</style>

</head>
<body>

<header class="fixed-header">
<a href="{{ url_for('index') }}" class="header-left" style="text-decoration:none;">
<div class="logo">
<img src="{{ url_for('static', filename='assets/logo.png') }}" style="height:30px;">
</div>
<div class="brand-name">Navaratna</div>
</a>
</header>

<div class="auth-container">

<div class="auth-box">

<h2 class="auth-title">Sign In</h2>

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
{% for category,message in messages %}
<div class="flash-msg {% if category=='success' %}flash-success{% endif %}">
{{ message }}
</div>
{% endfor %}
{% endif %}
{% endwith %}

<form action="{{ url_for('login') }}" method="POST">

<div class="input-group">
<label>Email</label>
<input type="email" name="email" required>
</div>

<div class="input-group">
<label>Password</label>
<input type="password" name="password" required>
</div>

<button type="submit" class="btn buy-now-btn auth-submit-btn">Login</button>

</form>

<a href="{{ url_for('signup') }}" class="auth-link">
Don't have an account? Sign Up
</a>

</div>

</div>

</body>
</html>
